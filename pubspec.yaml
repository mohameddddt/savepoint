name: savepoint
description: "Savepoint — a personal video game diary, backlog and stats tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  sqflite: ^2.4.5
  path: ^1.9.1
  cached_network_image: ^4.0.3
  share_plus: ^13.3.1
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  flutter_cache_manager: ^3.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage-500.ttf
          weight: 500
        - asset: assets/fonts/Bricolage-600.ttf
          weight: 600
        - asset: assets/fonts/Bricolage-700.ttf
          weight: 700
        - asset: assets/fonts/Bricolage-800.ttf
          weight: 800
    - family: Jakarta
      fonts:
        - asset: assets/fonts/Jakarta-400.ttf
          weight: 400
        - asset: assets/fonts/Jakarta-400i.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Jakarta-500.ttf
          weight: 500
        - asset: assets/fonts/Jakarta-600.ttf
          weight: 600
        - asset: assets/fonts/Jakarta-700.ttf
          weight: 700
        - asset: assets/fonts/Jakarta-800.ttf
          weight: 800
    - family: Mono
      fonts:
        - asset: assets/fonts/Mono-400.ttf
          weight: 400
        - asset: assets/fonts/Mono-600.ttf
          weight: 600
        - asset: assets/fonts/Mono-800.ttf
          weight: 800
